server:
  host: "localhost"
  port: 8080
  max_connections: 1000

storage:
  data_directory: "./data"
  log_segment_size: "100MB"
  index_interval: 1000
  retention_hours: 168  # 7 days

cluster:
  node_id: "node-1"
  nodes:
    - id: "node-1"
      host: "localhost"
      port: 8080
    - id: "node-2"
      host: "localhost"
      port: 8081

performance:
  write_buffer_size: "64KB"
  read_buffer_size: "64KB"
  sync_interval: "1s"
  cleanup_interval: "1h"

logging:
  level: "info"
  file: "./logs/yuclase.log"
